name: dl-foundations

channels:
  - defaults

dependencies:
  - python=3.10
  - pip
  - pip:
      # RTX 50 系显卡需要包含 sm_120 的 CUDA 12.8+ PyTorch 构建。
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.9.1+cu130
      - torchvision==0.24.1+cu130
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - matplotlib==3.10.9
      - jupyterlab==4.6.0
